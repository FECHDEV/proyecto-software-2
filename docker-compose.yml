# La aplicación en Docker: MySQL, la API y el cliente web detrás de nginx.
#   cp .env.example .env    (y completar los valores)
#   docker compose up -d --build
# El sitio queda en http://localhost (o el puerto de TIENDA_PUERTO).

services:
  base:
    # 8.4 LTS: la línea 8.0 terminó su soporte en abril de 2026. Abre una base
    # creada con 8.0 y la actualiza sola al arrancar (decisiones.md)
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tienda_db
      MYSQL_USER: tienda_app
      MYSQL_PASSWORD: ${TIENDA_DB_PASSWORD:?Falta TIENDA_DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      TZ: America/La_Paz
    # utf8mb4 para nombres con tildes y ñ, como en la base de desarrollo (README)
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - datos-mysql:/var/lib/mysql
    healthcheck:
      # Sin contraseña: ping responde que el servidor está vivo aunque niegue el acceso, así que no hace falta
      # ponerla en la línea de comandos (revisión total)
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Sin puertos publicados: solo la API llega a la base, por la red interna

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
    environment:
      TIENDA_DB_HOST: base
      TIENDA_DB_PASSWORD: ${TIENDA_DB_PASSWORD}
      TIENDA_JWT_SECRETO: ${TIENDA_JWT_SECRETO:?Falta TIENDA_JWT_SECRETO en .env}
      # El Administrador inicial se crea solo si todavía no hay ninguno (decisiones.md)
      TIENDA_ADMIN_CORREO: ${TIENDA_ADMIN_CORREO:?Falta TIENDA_ADMIN_CORREO en .env}
      TIENDA_ADMIN_PASSWORD: ${TIENDA_ADMIN_PASSWORD:?Falta TIENDA_ADMIN_PASSWORD en .env}
      TIENDA_ADMIN_NOMBRE: ${TIENDA_ADMIN_NOMBRE:-}
      TIENDA_ADMIN_APELLIDO: ${TIENDA_ADMIN_APELLIDO:-}
      TIENDA_CORS_ORIGENES: ${TIENDA_CORS_ORIGENES:-http://localhost}
      # Libélula por defecto, y sin appkey ni correo la API no arranca; simulador solo para probar en la PC
      # (decisiones.md → Pagos). La URL vacía usa la de producción
      TIENDA_PAGO_PROVEEDOR: ${TIENDA_PAGO_PROVEEDOR:-libelula}
      TIENDA_PAGO_LIBELULA_URL: ${TIENDA_PAGO_LIBELULA_URL:-https://api.libelula.bo}
      TIENDA_PAGO_LIBELULA_APPKEY: ${TIENDA_PAGO_LIBELULA_APPKEY:-}
      TIENDA_PAGO_LIBELULA_EMAIL: ${TIENDA_PAGO_LIBELULA_EMAIL:-}
      TIENDA_MARCA: ${TIENDA_MARCA:-Tienda Montero}
      # Correo: Gmail por defecto, y sin usuario ni contraseña la API no arranca; simulador solo para probar en la
      # PC: escribe en el log los enlaces de recuperación (decisiones.md → Notificaciones, 26/10/2026)
      TIENDA_CORREO_PROVEEDOR: ${TIENDA_CORREO_PROVEEDOR:-smtp}
      TIENDA_CORREO_USUARIO: ${TIENDA_CORREO_USUARIO:-}
      TIENDA_CORREO_CONTRASENA: ${TIENDA_CORREO_CONTRASENA:-}
      TIENDA_CORREO_HOST: ${TIENDA_CORREO_HOST:-smtp.gmail.com}
      TIENDA_CORREO_PUERTO: ${TIENDA_CORREO_PUERTO:-587}
      TIENDA_CORREO_REMITENTE: ${TIENDA_MARCA:-Tienda Montero} <${TIENDA_CORREO_USUARIO:-no-responder@localhost}>
      TIENDA_SITIO_URL: ${TIENDA_SITIO_URL:-http://localhost}
      # Catálogo de demostración (issue #25): con la carpeta del .env, la API la ve en /datos/demo y la carga si
      # todavía no hay productos; sin ella, la variable queda vacía y no se carga nada
      TIENDA_DEMO_DIRECTORIO: ${TIENDA_DEMO_DIRECTORIO:+/datos/demo}
      # Dónde y cuándo se retiran los pedidos (HU-12): vacías, no se muestran
      TIENDA_RETIRO_DIRECCION: ${TIENDA_RETIRO_DIRECCION:-}
      TIENDA_RETIRO_HORARIO: ${TIENDA_RETIRO_HORARIO:-}
    volumes:
      - imagenes:/datos/imagenes
      # Solo lectura. Sin TIENDA_DEMO_DIRECTORIO se monta una carpeta vacía del repositorio, que no se lee
      - ${TIENDA_DEMO_DIRECTORIO:-./backend/demo-vacia}:/datos/demo:ro
    # Sin puertos publicados: se llega por nginx, bajo /api

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${TIENDA_PUERTO:-80}:80"

volumes:
  datos-mysql:
  imagenes:
