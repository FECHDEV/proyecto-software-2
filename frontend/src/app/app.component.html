<a class="salto-al-contenido" href="#contenido">Saltar al contenido</a>

<header>
  <div class="barra">
    <div class="principal">
      <a class="marca" routerLink="/" [attr.aria-label]="marca.nombre + ', ir al inicio'">
        <span class="logotipo" aria-hidden="true">{{ marca.inicial }}</span>
        <span class="nombre" translate="no">{{ marca.nombre }}</span>
      </a>

      <nav aria-label="Módulos">
        <ul>
          <li>
            <a
              routerLink="/"
              routerLinkActive="actual"
              [routerLinkActiveOptions]="{ exact: true }"
              ariaCurrentWhenActive="page"
            >
              <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 10.5 12 3l9 7.5" />
                <path d="M5.5 9v11h13V9" />
                <path d="M10 20v-6h4v6" />
              </svg>
              Inicio
            </a>
          </li>
          @for (modulo of modulos(); track modulo.ruta) {
            <li>
              <a [routerLink]="modulo.ruta" routerLinkActive="actual" ariaCurrentWhenActive="page">
                {{ modulo.nombre }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>

    <div class="sesion">
      <button
        type="button"
        class="tema"
        [attr.aria-label]="enClaro() ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'"
        [title]="enClaro() ? 'Modo oscuro' : 'Modo claro'"
        (click)="alternarTema()"
      >
        @if (enClaro()) {
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
          </svg>
        } @else {
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        }
      </button>

      @if (autenticado()) {
        <a
          class="perfil"
          routerLink="/mis-datos"
          routerLinkActive="actual"
          ariaCurrentWhenActive="page"
          [attr.aria-label]="'Mis datos de ' + nombre()"
        >
          <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" />
          </svg>
          <span class="usuario" [title]="nombre()">{{ nombre() }}</span>
        </a>
        <button type="button" class="salir" (click)="salir()">Cerrar sesión</button>
      } @else {
        <a class="entrar" routerLink="/inicio-sesion">Iniciar sesión</a>
        <a class="crear-cuenta" routerLink="/registro">Crear cuenta</a>
      }
    </div>
  </div>
</header>

<main id="contenido" tabindex="-1">
  <router-outlet />
</main>
