<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tienda Montero</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <!-- Aplica el modo claro antes de pintar, si fue lo elegido: sin esto la
       página aparece oscura un instante y después cambia. La clave es la de
       core/tema/almacen-tema.ts; desde ahí sigue TemaService -->
  <script>
    try {
      if (localStorage.getItem('app.tema') === 'claro') {
        document.documentElement.dataset.tema = 'claro';
        document.querySelector('meta[name="theme-color"]').content = '#f6f7fb';
      }
    } catch (e) {}
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Fuentes desde el HTML y no con @import en el CSS: así el navegador las
       pide en paralelo en vez de esperar a descargar la hoja de estilos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
