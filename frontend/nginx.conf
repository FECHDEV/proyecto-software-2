# La aplicación en producción: la aplicación Angular y, bajo /api, el backend.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# Imágenes de hasta 2 MB en un formulario de hasta 3 MB (application.properties).
	# Un poco más, para que el backend responda IMAGEN_DEMASIADO_GRANDE en vez de cortar nginx
	client_max_body_size 5m;

	# ^~: una ruta de la API nunca cae en la regla de archivos estáticos de abajo
	location ^~ /api/ {
		proxy_pass http://backend:8080;
		proxy_set_header Host $host;
		# La IP real del cliente: el backend la usa para el límite de intentos
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
	}

	# Los archivos con hash en el nombre no cambian nunca: se guardan un año
	location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# Una ruta de Angular (/usuarios, /mis-datos) se resuelve en el navegador
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
