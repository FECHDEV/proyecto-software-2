# La aplicación en producción: la aplicación Angular y, bajo /api, el backend.

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# Imágenes de hasta 2 MB y modelos de hasta 3 MB en un formulario de hasta 4 MB
	# (application.properties). Un poco más, para que el backend responda
	# IMAGEN_DEMASIADO_GRANDE o MODELO_DEMASIADO_GRANDE en vez de cortar nginx
	client_max_body_size 5m;

	# ^~: una ruta de la API nunca cae en la regla de archivos estáticos de abajo
	location ^~ /api/ {
		# El nombre se resuelve en cada petición (el DNS de Docker) y no una sola vez al arrancar: si se recrea solo el
		# backend con otra IP, nginx no responde 502 hasta reiniciarse (revisión total, 26/10/2026)
		resolver 127.0.0.11 valid=10s ipv6=off;
		set $api http://backend:8080;
		proxy_pass $api;
		proxy_set_header Host $host;
		# La IP real del cliente: el backend la usa para el límite de intentos
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
	}

	# Los decodificadores del visor 3D (HU-16) no llevan hash: se revalidan en cada
	# visita (un 304 si no cambiaron), y uno que falta es un 404, no index.html
	location ^~ /decodificadores/ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# Las texturas de la marca (_tokens.scss) tampoco llevan hash: se revalidan como los decodificadores
	location ^~ /texturas/ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# Los archivos con hash en el nombre no cambian nunca: se guardan un año
	location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# Una ruta de Angular (/usuarios, /mis-datos) se resuelve en el navegador
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
