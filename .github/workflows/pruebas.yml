# Corre las pruebas del backend y del frontend en cada PR y en cada push a main,
# para que nada se mergee en rojo aunque el cambio venga de otra máquina o de
# otra herramienta. El backend prueba sobre H2 (perfil test): no necesita MySQL.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

# Solo lee el código: el token de la corrida no puede escribir en el repositorio (revisión total)
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  # El camino principal en el navegador (registro → catálogo → carrito → pedido → pago simulado → mis pedidos)
  # contra la tienda completa de docker-compose.yml, con los simuladores de pago y de correo. Construye las dos
  # imágenes: también comprueba que un Dockerfile roto no llegue a main
  e2e:
    name: Extremo a extremo (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Registros de la API
        if: failure()
        run: docker compose -p tienda-e2e -f ../docker-compose.yml --env-file e2e/.env.e2e logs backend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: informe-e2e
          path: frontend/playwright-report/
          retention-days: 7
