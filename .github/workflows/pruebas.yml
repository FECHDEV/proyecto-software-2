# Corre las pruebas del backend y del frontend en cada PR y en cada push a main,
# para que nada se mergee en rojo aunque el cambio venga de otra máquina o de
# otra herramienta. El backend prueba sobre H2 (perfil test): no necesita MySQL.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la corrida anterior
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
