spring.application.name=tienda

# ---------------------------------------------------------------------------
# Perfil local de desarrollo. Sin perfil activo se carga
# application-local.properties (ignorado por git), con las credenciales de
# desarrollo para no definir variables de entorno en cada terminal. En
# produccion se activa otro perfil (SPRING_PROFILES_ACTIVE) y ese archivo no
# se usa. Los tests activan el perfil test.
# ---------------------------------------------------------------------------
spring.profiles.default=local

# ---------------------------------------------------------------------------
# Base de datos - MySQL 8.0
# Las credenciales se leen de variables de entorno. Nunca escribir la
# contrasena real en este archivo: esta versionado en git.
#
# Los nombres llevan el prefijo del proyecto (TIENDA_) a proposito: si la
# maquina ya tiene DB_USER, DB_PASSWORD o DB_URL de otro proyecto, como las
# variables de entorno tienen prioridad, unos nombres genericos harian que la
# aplicacion se conecte a la base equivocada.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${TIENDA_DB_HOST:localhost}:${TIENDA_DB_PORT:3306}/${TIENDA_DB_NAME:tienda_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/La_Paz&characterEncoding=UTF-8
spring.datasource.username=${TIENDA_DB_USER:tienda_app}
spring.datasource.password=${TIENDA_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate: el esquema lo genera Hibernate, sin migraciones versionadas
# (decisiones.md -> Base de datos).
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------------
# Zona horaria de la aplicacion (Santa Cruz, Bolivia)
# ---------------------------------------------------------------------------
spring.jackson.time-zone=America/La_Paz
# Un entero con decimales (2.5) se rechaza con 400 en vez de truncarse en
# silencio: vale para cantidades y limites.
spring.jackson.deserialization.accept-float-as-int=false

# ---------------------------------------------------------------------------
# CORS: origenes del frontend autorizados a llamar a la API.
# Varios origenes se separan con coma.
# ---------------------------------------------------------------------------
tienda.cors.origenes-permitidos=${TIENDA_CORS_ORIGENES:http://localhost:4200}

# ---------------------------------------------------------------------------
# JWT. La clave se lee de TIENDA_JWT_SECRETO: base64 de al menos 256 bits.
# Sin valor por defecto a proposito: si falta, la aplicacion no arranca,
# porque con una clave conocida cualquiera podria fabricar tokens.
# ---------------------------------------------------------------------------
tienda.jwt.secreto=${TIENDA_JWT_SECRETO}
tienda.jwt.duracion=8h

# ---------------------------------------------------------------------------
# Administrador inicial (decisiones.md). Solo se leen si no existe ningun
# administrador; en ese caso, sin estas variables la aplicacion no arranca.
# ---------------------------------------------------------------------------
tienda.admin.correo=${TIENDA_ADMIN_CORREO:}
tienda.admin.contrasena=${TIENDA_ADMIN_PASSWORD:}

# ---------------------------------------------------------------------------
# La autenticacion es por JWT (JwtFiltroAutenticacion): se desactiva el usuario
# en memoria con contrasena generada que Spring Boot crea por defecto.
# ---------------------------------------------------------------------------
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------------------
# Imagenes subidas (AlmacenImagenes). Carpeta del servidor; en Docker, un
# volumen. Hasta 2 MB por imagen: el limite de la peticion deja margen para los
# demas datos del formulario multipart.
# ---------------------------------------------------------------------------
tienda.imagenes.directorio=${TIENDA_IMAGENES_DIRECTORIO:./datos/imagenes}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Tomcat corta la subida en el limite de multipart y despues descarta lo que
# falta del cuerpo; por defecto solo 2 MB, y si queda mas cierra la conexion.
# Con 20 MB una foto de celular recibe el aviso IMAGEN_DEMASIADO_GRANDE en vez
# de un error de red; mas alla de eso se sigue cortando.
server.tomcat.max-swallow-size=20MB

# ---------------------------------------------------------------------------
# Sistema de pago (decisiones.md -> Pago: interfaz propia). Por defecto, el
# simulador local.
# ---------------------------------------------------------------------------
tienda.pago.proveedor=${TIENDA_PAGO_PROVEEDOR:simulador}

# ---------------------------------------------------------------------------
# Correo (decisiones.md -> Notificaciones). Por defecto, el simulador, que solo
# escribe en el log; con smtp, Gmail con una cuenta del proyecto y una
# "contrasena de aplicacion" (nunca la contrasena de la cuenta). Las
# credenciales llegan solo del .env. La URL del sitio arma los enlaces de los
# correos (restablecer la contrasena).
# ---------------------------------------------------------------------------
tienda.correo.proveedor=${TIENDA_CORREO_PROVEEDOR:simulador}
tienda.correo.marca=${TIENDA_MARCA:Tienda Montero}
tienda.correo.remitente=${TIENDA_CORREO_REMITENTE:Tienda <no-responder@localhost>}
tienda.correo.url-del-sitio=${TIENDA_SITIO_URL:http://localhost:4200}
spring.mail.host=${TIENDA_CORREO_HOST:smtp.gmail.com}
spring.mail.port=${TIENDA_CORREO_PUERTO:587}
spring.mail.username=${TIENDA_CORREO_USUARIO:}
spring.mail.password=${TIENDA_CORREO_CONTRASENA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
