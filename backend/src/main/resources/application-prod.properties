# ---------------------------------------------------------------------------
# Perfil de producción (Docker). Lo activa SPRING_PROFILES_ACTIVE=prod en la
# imagen del backend. Todo lo sensible llega por variables de entorno desde el
# .env de docker-compose; este archivo no lleva secretos.
# ---------------------------------------------------------------------------

# Sin el SQL de cada consulta en los registros
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Detrás de nginx (decisiones.md → Seguridad: detrás de un proxy inverso). Tomcat
# toma la IP real del cliente de X-Forwarded-For, que nginx agrega, y confía solo
# en proxies de redes internas (la red de docker-compose). Sin esto, todos los
# clientes compartirían la IP de nginx y el límite de intentos de inicio de
# sesión bloquearía a todos a la vez.
server.forward-headers-strategy=native

# El sistema de pago real por defecto (decisiones.md -> Pagos, 23/10/2026): sin
# la appkey ni el correo de Libelula la API no arranca, en vez de quedar con el
# simulador, que deja a cualquier cliente marcar pagado su pedido. Para probar
# en la PC, TIENDA_PAGO_PROVEEDOR=simulador en el .env
tienda.pago.proveedor=${TIENDA_PAGO_PROVEEDOR:libelula}

# El correo real por defecto (revision total, 26/10/2026), como el pago: el
# simulador escribe en el log los enlaces de recuperacion y de verificacion, asi
# que en un servidor quien lea los logs podria entrar a cualquier cuenta. Sin
# TIENDA_CORREO_USUARIO y TIENDA_CORREO_CONTRASENA la API no arranca. Para
# probar en la PC, TIENDA_CORREO_PROVEEDOR=simulador en el .env
tienda.correo.proveedor=${TIENDA_CORREO_PROVEEDOR:smtp}
