# ---------------------------------------------------------------------------
# Perfil de pruebas: H2 en memoria, en modo de compatibilidad con MySQL.
# Las pruebas de unidad no dependen de que el MySQL local este levantado.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:tienda_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Clave fija solo para pruebas (base64 de 40 bytes). Nunca usarla fuera de H2.
tienda.jwt.secreto=Y2xhdmUtZGUtcHJ1ZWJhcy1wYXJhLXRva2Vucy1qd3QtZXZlbnRvcw==

# Administrador inicial de pruebas: los @SpringBootTest lo crean en H2 al arrancar
tienda.admin.correo=admin@tienda.test
tienda.admin.contrasena=clave-admin-pruebas

# Imagenes de las pruebas de integracion, fuera del arbol del proyecto
tienda.imagenes.directorio=${java.io.tmpdir}/tienda-pruebas-imagenes

# El simulador de pago
tienda.pago.proveedor=simulador

# El simulador de correo: las pruebas no necesitan un servidor SMTP
tienda.correo.proveedor=simulador
